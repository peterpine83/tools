#cloud-config

package_update: true
package_upgrade: true

packages:
  - curl
  - git
  - build-essential
  - unzip
  - jq
  - htop
  - tmux

runcmd:
  # Install Node.js 20 LTS
  - curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
  - apt-get install -y nodejs

  # Install OpenClaw and Claude Code
  - npm install -g openclaw
  - npm install -g @anthropic-ai/claude-code

  # Initialize OpenClaw for ubuntu user
  - sudo -u ubuntu openclaw init --non-interactive || true

  # Create workspace directories
  - mkdir -p /home/ubuntu/.openclaw/workspace/memory
  - chown -R ubuntu:ubuntu /home/ubuntu/.openclaw

  # Create systemd service
  - |
    cat > /etc/systemd/system/openclaw.service << 'EOF'
    [Unit]
    Description=OpenClaw Gateway
    After=network.target
    StartLimitIntervalSec=300
    StartLimitBurst=5

    [Service]
    Type=simple
    User=ubuntu
    Group=ubuntu
    WorkingDirectory=/home/ubuntu
    ExecStart=/usr/bin/openclaw gateway start --foreground
    Restart=always
    RestartSec=10
    StandardOutput=journal
    StandardError=journal
    SyslogIdentifier=openclaw
    NoNewPrivileges=true
    ProtectSystem=strict
    ProtectHome=read-only
    ReadWritePaths=/home/ubuntu/.openclaw
    PrivateTmp=true
    Environment=NODE_ENV=production

    [Install]
    WantedBy=multi-user.target
    EOF

  - systemctl daemon-reload

  # Create helper scripts
  - |
    cat > /usr/local/bin/openclaw-logs << 'EOF'
    #!/bin/bash
    journalctl -u openclaw -f --no-hostname
    EOF
    chmod +x /usr/local/bin/openclaw-logs

  - |
    cat > /usr/local/bin/openclaw-status << 'EOF'
    #!/bin/bash
    echo "=== OpenClaw Service Status ==="
    systemctl status openclaw --no-pager
    echo ""
    echo "=== Recent Logs ==="
    journalctl -u openclaw -n 20 --no-pager --no-hostname
    EOF
    chmod +x /usr/local/bin/openclaw-status

  # Create workspace files
  - |
    cat > /home/ubuntu/.openclaw/workspace/AGENTS.md << 'EOF'
    # AGENTS.md - Work OpenClaw Instance

    This is the work instance of OpenClaw.

    ## Session Start
    1. Read SOUL.md
    2. Read USER.md  
    3. Check memory/YYYY-MM-DD.md for recent context

    ## Guidelines
    - This instance is for work projects only
    - Keep work and personal separate
    - Bill to work OAuth token
    EOF

  - |
    cat > /home/ubuntu/.openclaw/workspace/SOUL.md << 'EOF'
    # SOUL.md - Work Instance

    You are a work-focused AI assistant.

    ## Core Principles
    - Professional and efficient
    - Focus on work projects and tasks
    - Keep responses concise and actionable
    EOF

  - |
    cat > /home/ubuntu/.openclaw/workspace/USER.md << 'EOF'
    # USER.md - About the User

    - **Name:** [Your name]
    - **Role:** [Your role]
    - **Timezone:** America/New_York

    ## Work Context
    [Add your work context here]
    EOF

  - |
    cat > /home/ubuntu/.openclaw/workspace/MEMORY.md << 'EOF'
    # MEMORY.md - Work Long-Term Memory

    ## Active Projects
    [Add projects here]
    EOF

  - chown -R ubuntu:ubuntu /home/ubuntu/.openclaw

  # Signal completion
  - echo "OpenClaw setup complete!" > /home/ubuntu/setup-complete.txt

final_message: |
  OpenClaw work instance setup complete!
  
  Next steps:
  1. SSH in as ubuntu
  2. Run: claude login (use WORK credentials)
  3. Run: openclaw config
  4. Run: sudo systemctl start openclaw && sudo systemctl enable openclaw
